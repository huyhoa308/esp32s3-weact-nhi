<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Nhi – AI desk robot on ESP32-S3">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#1a1240"/>
      <stop offset="1" stop-color="#2a0f3d"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="0.15" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3f63"/>
      <stop offset="1" stop-color="#1c1f3a"/>
    </linearGradient>
    <linearGradient id="acrylic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9be7ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#9be7ff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <rect width="1280" height="420" fill="url(#glowL)"/>
  <rect width="1280" height="420" fill="url(#glowP)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="60" r="1.4" opacity="0.7"/>
    <circle cx="210" cy="30" r="1" opacity="0.5"/>
    <circle cx="420" cy="70" r="1.2" opacity="0.6"/>
    <circle cx="610" cy="35" r="1" opacity="0.4"/>
    <circle cx="700" cy="380" r="1.2" opacity="0.4"/>
    <circle cx="1210" cy="50" r="1.4" opacity="0.7"/>
    <circle cx="1240" cy="330" r="1" opacity="0.5"/>
    <circle cx="560" cy="390" r="1" opacity="0.4"/>
    <circle cx="1120" cy="390" r="1.2" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="25" r="1.3" opacity="0.6">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- title block -->
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="118" font-size="20" letter-spacing="6" fill="#94a3b8" font-weight="600">AI DESK ROBOT · ESP32-S3</text>
    <text x="76" y="218" font-size="104" font-weight="800" fill="url(#title)">Nhi</text>
    <text x="80" y="266" font-size="28" fill="#e2e8f0" font-weight="500">Trò chuyện tiếng Việt · Biểu cảm bằng mắt &amp; cái đầu</text>

    <!-- chips -->
    <g font-size="16" font-weight="600">
      <g transform="translate(80 300)">
        <rect width="150" height="36" rx="18" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.6"/>
        <text x="75" y="24" text-anchor="middle" fill="#a5f3fc">“Chào Nhi”</text>
      </g>
      <g transform="translate(244 300)">
        <rect width="150" height="36" rx="18" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.6"/>
        <text x="75" y="24" text-anchor="middle" fill="#ddd6fe">RoboEyes TFT</text>
      </g>
      <g transform="translate(408 300)">
        <rect width="170" height="36" rx="18" fill="#f472b6" fill-opacity="0.14" stroke="#f472b6" stroke-opacity="0.6"/>
        <text x="85" y="24" text-anchor="middle" fill="#fbcfe8">Pan / Tilt servo</text>
      </g>
      <g transform="translate(592 300)">
        <rect width="150" height="36" rx="18" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.6"/>
        <text x="75" y="24" text-anchor="middle" fill="#a7f3d0">xiaozhi-esp32</text>
      </g>
    </g>
  </g>

  <!-- robot -->
  <g transform="translate(980 40)">
    <!-- pan arc -->
    <path d="M-150 120 A170 170 0 0 1 150 120" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 8"/>
    <path d="M-150 120 l10 -14 M-150 120 l16 4" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="2" fill="none"/>
    <path d="M150 120 l-10 -14 M150 120 l-16 4" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="2" fill="none"/>

    <!-- sound waves -->
    <g fill="none" stroke="#f0abfc" stroke-linecap="round" stroke-width="3">
      <path d="M130 170 q14 18 0 36" opacity="0.8">
        <animate attributeName="opacity" values="0.1;0.9;0.1" dur="1.6s" repeatCount="indefinite"/>
      </path>
      <path d="M148 158 q24 30 0 60" opacity="0.5">
        <animate attributeName="opacity" values="0.1;0.7;0.1" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
      </path>
      <path d="M166 146 q34 42 0 84" opacity="0.3">
        <animate attributeName="opacity" values="0;0.5;0" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- base (acrylic case) -->
    <rect x="-130" y="285" width="260" height="60" rx="10" fill="url(#acrylic)" stroke="#9be7ff" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="-110" y="300" width="220" height="14" rx="3" fill="#7f1d1d" opacity="0.7"/>
    <circle cx="-115" cy="296" r="4" fill="#cbd5e1" opacity="0.7"/>
    <circle cx="115" cy="296" r="4" fill="#cbd5e1" opacity="0.7"/>
    <circle cx="-60" cy="328" r="4" fill="#f87171">
      <animate attributeName="fill-opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- neck / bracket -->
    <rect x="-18" y="240" width="36" height="48" rx="6" fill="url(#metal)" stroke="#64748b" stroke-width="1.5"/>
    <path d="M-62 250 V170 H-48 V236 H48 V170 H62 V250 Z" fill="url(#metal)" stroke="#64748b" stroke-width="1.5"/>

    <!-- head, gently swaying (pan) and nodding (tilt) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 0 200; 6 0 200; -6 0 200" dur="7s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="130" rx="120" ry="80" fill="#22d3ee" opacity="0.18" filter="url(#blur)"/>
      <rect x="-110" y="60" width="220" height="150" rx="20" fill="#1e2142" stroke="#475569" stroke-width="3"/>
      <rect x="-94" y="76" width="188" height="118" rx="10" fill="#03060f"/>
      <circle cx="-98" cy="66" r="4" fill="#94a3b8"/>
      <circle cx="98" cy="66" r="4" fill="#94a3b8"/>
      <circle cx="-98" cy="204" r="4" fill="#94a3b8"/>
      <circle cx="98" cy="204" r="4" fill="#94a3b8"/>

      <!-- eyes: look around + blink -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; -14 -4; -14 -4; 0 0; 0 0; 14 0; 14 0; 0 0" keyTimes="0;0.2;0.28;0.42;0.5;0.62;0.7;0.85;1" dur="8s" repeatCount="indefinite"/>
        <g fill="#67e8f9" filter="none">
          <rect x="-66" y="104" width="52" height="62" rx="14">
            <animate attributeName="height" values="62;62;6;62;62" keyTimes="0;0.46;0.5;0.54;1" dur="4s" repeatCount="indefinite"/>
            <animate attributeName="y" values="104;104;132;104;104" keyTimes="0;0.46;0.5;0.54;1" dur="4s" repeatCount="indefinite"/>
          </rect>
          <rect x="14" y="104" width="52" height="62" rx="14">
            <animate attributeName="height" values="62;62;6;62;62" keyTimes="0;0.46;0.5;0.54;1" dur="4s" repeatCount="indefinite"/>
            <animate attributeName="y" values="104;104;132;104;104" keyTimes="0;0.46;0.5;0.54;1" dur="4s" repeatCount="indefinite"/>
          </rect>
        </g>
        <g fill="#67e8f9" opacity="0.5" filter="url(#blur)">
          <rect x="-66" y="104" width="52" height="62" rx="14"/>
          <rect x="14" y="104" width="52" height="62" rx="14"/>
        </g>
      </g>
    </g>
  </g>
</svg>
